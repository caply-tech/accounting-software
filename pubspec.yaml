name: accounting_software
description: Offline-first, multi-business accounting management software.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local, encrypted, offline database
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Charts (Dashboard, Payroll, Inventory)
  fl_chart: ^0.68.0

  # Reporting: PDF + printing + Excel export
  pdf: ^3.11.0
  printing: ^5.13.1
  excel: ^4.0.6

  # IDs for offline-safe primary keys (see docs/database-architecture.md)
  uuid: ^4.4.0

  # Password hashing for real authentication — pure Dart (no native/FFI),
  # so it works identically on the web build, unlike Argon2 bindings.
  bcrypt: ^1.1.3

  # LAN host/client multi-device mode (Phase 4 — scaffolded, not wired into MVP)
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.19.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
